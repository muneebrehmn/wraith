<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wraith &mdash; Wraith Security Scan</title>
  <style>

    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #080808;
      --surface: #0f0f0f;
      --edge:    #1a1a1a;
      --mid:     #2a2a2a;
      --text:    #c8c8c8;
      --dim:     #555555;
      --white:   #f0f0f0;

      --mono:    'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      --sans:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --display: 'Courier New', 'Courier', monospace;

      --crit: #c0392b;
      --high: #b8621a;
      --med:  #9a7d0a;
      --low:  #1e8449;
      --info: #3a3a3a;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--text); text-decoration: none; }
    a:hover { color: var(--white); }

    code {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--edge);
      border-radius: 2px;
      padding: 1px 6px;
      color: #888;
    }

    pre {
      font-family: var(--mono);
      font-size: 11.5px;
      background: var(--surface);
      border: 1px solid var(--edge);
      padding: 14px 18px;
      overflow-x: auto;
      line-height: 1.65;
      color: #555;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* ── Layout ────────────────────────────────────── */
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* ── Top accent bar ────────────────────────────── */
    .topbar {
      height: 2px;
      background: var(--mid);
    }

    /* ── Header ────────────────────────────────────── */
    .rpt-header {
      padding: 40px 0 32px;
      border-bottom: 1px solid var(--edge);
      margin-bottom: 36px;
    }

    .rpt-header-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: wrap;
    }

    .rpt-brand {
      font-family: var(--display);
      font-size: 20px;
      letter-spacing: 0.12em;
      color: var(--white);
    }

    .rpt-brand .sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      vertical-align: middle;
      margin-left: 10px;
      font-weight: 300;
    }

    .rpt-scanname {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      margin-top: 6px;
      letter-spacing: 0.06em;
    }

    .rpt-meta {
      text-align: right;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim);
      line-height: 2;
      letter-spacing: 0.04em;
    }

    .rpt-meta strong {
      color: var(--text);
      font-weight: 400;
    }

    /* ── Summary row ───────────────────────────────── */
    .summary-row {
      display: flex;
      gap: 1px;
      background: var(--edge);
      border: 1px solid var(--edge);
      margin-bottom: 32px;
    }

    .sev-cell {
      flex: 1;
      background: var(--black);
      padding: 20px 24px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .sev-cell:hover { background: var(--surface); }

    .sev-cell .num {
      font-family: var(--display);
      font-size: 32px;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .sev-cell .lbl {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 4px;
    }

    /* ── Filters ───────────────────────────────────── */
    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-right: 4px;
    }

    .filter-btn {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--edge);
      color: var(--dim);
      padding: 4px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .filter-btn:hover {
      border-color: var(--mid);
      color: var(--text);
    }

    .filter-btn.active {
      border-color: var(--text);
      color: var(--white);
      background: var(--surface);
    }

    /* ── Count label ───────────────────────────────── */
    .count-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ── Findings list ─────────────────────────────── */
    .findings-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--edge);
      border: 1px solid var(--edge);
      margin-bottom: 60px;
    }

    /* ── Finding card ──────────────────────────────── */
    .fcard {
      background: var(--black);
      overflow: hidden;
    }

    .fcard.hidden { display: none; }

    .fcard-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      border-left: 2px solid transparent;
      transition: background 0.15s;
    }

    .fcard-header:hover { background: var(--surface); }

    .sev-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sev-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      flex-shrink: 0;
      min-width: 62px;
    }

    .fcard-title {
      font-family: var(--sans);
      font-size: 13.5px;
      font-weight: 400;
      color: var(--white);
      flex: 1;
    }

    .fcard-phase {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .fcard-chevron {
      font-size: 9px;
      color: var(--dim);
      transition: transform 0.2s;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .fcard-chevron.open { transform: rotate(180deg); }

    /* Severity left-border colors */
    .bl-critical { border-left-color: var(--crit) !important; }
    .bl-high     { border-left-color: var(--high) !important; }
    .bl-medium   { border-left-color: var(--med)  !important; }
    .bl-low      { border-left-color: var(--low)  !important; }
    .bl-info     { border-left-color: var(--info) !important; }

    /* Severity dot colors */
    .dot-critical { background: var(--crit); }
    .dot-high     { background: var(--high); }
    .dot-medium   { background: var(--med);  }
    .dot-low      { background: var(--low);  }
    .dot-info     { background: var(--info); }

    /* ── Card body ─────────────────────────────────── */
    .fcard-body {
      display: none;
      padding: 0 22px 24px;
      border-top: 1px solid var(--edge);
    }

    .fcard-body.open { display: block; }

    /* ── Sections inside card body ─────────────────── */
    .fsection {
      margin-top: 20px;
    }

    .fsection-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fsection-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--edge);
    }

    .fdescription {
      font-size: 13px;
      font-weight: 300;
      color: var(--text);
      line-height: 1.75;
    }

    .fremediation {
      font-family: var(--mono);
      font-size: 11.5px;
      color: #3a7d44;
      background: var(--surface);
      border: 1px solid var(--edge);
      border-left: 2px solid var(--low);
      padding: 12px 16px;
      line-height: 1.7;
    }

    .tag-list {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      font-family: var(--mono);
      font-size: 10px;
      background: var(--surface);
      border: 1px solid var(--edge);
      color: var(--dim);
      padding: 2px 8px;
      letter-spacing: 0.06em;
    }

    .cwe-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      border: 1px solid var(--edge);
      padding: 3px 9px;
      margin-top: 8px;
      letter-spacing: 0.06em;
      transition: border-color 0.15s, color 0.15s;
    }

    .cwe-link:hover {
      border-color: var(--mid);
      color: var(--text);
    }

    /* ── Empty state ───────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Footer ────────────────────────────────────── */
    .rpt-footer {
      border-top: 1px solid var(--edge);
      padding: 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .rpt-footer-logo {
      font-family: var(--display);
      font-size: 16px;
      letter-spacing: 0.1em;
      color: var(--mid);
    }

    .rpt-footer-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.06em;
    }

    /* ── Responsive ────────────────────────────────── */
    @media (max-width: 640px) {
      .wrap { padding: 0 20px; }
      .summary-row { flex-wrap: wrap; }
      .sev-cell { min-width: 80px; }
      .rpt-header-inner { flex-direction: column; }
      .rpt-meta { text-align: left; }
    }

  </style>
</head>
<body>

<div class="topbar"></div>
<div class="wrap">

  <div class="rpt-header">
    <div class="rpt-header-inner">

      <div>
        <div class="rpt-brand">
          SPECTER
          <span class="sub">Security Report</span>
        </div>
        <div class="rpt-scanname">Wraith Security Scan</div>
      </div>

      <div class="rpt-meta">
        <div><strong>https://target.com</strong></div>
        <div>2026-05-09T05:18:36.952744Z</div>
        <div>v1.0.0 &nbsp;&middot;&nbsp; 0 findings &nbsp;&middot;&nbsp; Risk: None</div>
      </div>

    </div>
  </div>


  <div class="summary-row">
    
    <div class="sev-cell" onclick="filterBySev('critical')" title="Show critical">
      <div class="num" style="color: var(--crit);">0</div>
      <div class="lbl">critical</div>
    </div>
    <div class="sev-cell" onclick="filterBySev('high')" title="Show high">
      <div class="num" style="color: var(--high);">0</div>
      <div class="lbl">high</div>
    </div>
    <div class="sev-cell" onclick="filterBySev('medium')" title="Show medium">
      <div class="num" style="color: var(--med);">0</div>
      <div class="lbl">medium</div>
    </div>
    <div class="sev-cell" onclick="filterBySev('low')" title="Show low">
      <div class="num" style="color: var(--low);">0</div>
      <div class="lbl">low</div>
    </div>
    <div class="sev-cell" onclick="filterBySev('info')" title="Show info">
      <div class="num" style="color: var(--info);">0</div>
      <div class="lbl">info</div>
    </div>
  </div>


  <div class="filter-row">
    <span class="filter-label">Filter</span>
    <button class="filter-btn active" onclick="filterBySev('all')">All</button>

    
  </div>

  <div class="count-label">0 findings</div>


  <div class="empty-state">
    No findings &mdash; scan clean or no checks configured.
  </div>


  <div class="rpt-footer">
    <div class="rpt-footer-logo">SPECTER</div>
    <div class="rpt-footer-meta">
      0 findings &nbsp;&middot;&nbsp; 2026-05-09T05:18:36.952744Z &nbsp;&middot;&nbsp; v1.0.0
    </div>
  </div>

</div><!-- /.wrap -->

<script>

  // ── Card toggle ───────────────────────────────────────────────
  function toggleCard(id) {
    var body = document.getElementById('body-' + id);
    var chev = document.getElementById('chev-' + id);
    body.classList.toggle('open');
    chev.classList.toggle('open');
  }

  // ── Active filter state ───────────────────────────────────────
  var activeSev   = 'all';
  var activePhase = 'all';

  function applyFilters() {
    var cards = document.querySelectorAll('.fcard');
    cards.forEach(function(card) {
      var sevMatch   = activeSev   === 'all' || card.dataset.sev   === activeSev;
      var phaseMatch = activePhase === 'all' || card.dataset.phase === activePhase;
      card.classList.toggle('hidden', !(sevMatch && phaseMatch));
    });
  }

  function filterBySev(sev) {
    activeSev = sev;
    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      var match = (sev === 'all' && btn.textContent.trim() === 'All')
               || btn.textContent.trim().toLowerCase() === sev.toLowerCase();
      btn.classList.toggle('active', match);
    });
    applyFilters();
  }

  function filterByPhase(phase) {
    activePhase = (activePhase === phase) ? 'all' : phase;
    applyFilters();
  }

  // ── Auto-open first critical or high finding ──────────────────
  (function() {
    var first = document.querySelector('.fcard[data-sev="critical"]')
             || document.querySelector('.fcard[data-sev="high"]');
    if (first) {
      toggleCard(first.id);
    }
  })();

</script>

</body>
</html>
